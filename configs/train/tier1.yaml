# Continued pretraining (story CPT), Tier 1: full fine-tune, bf16.
model: tier1
seed: 0
lr: 3.0e-4
min_lr_ratio: 0.1
warmup_frac: 0.02
weight_decay: 0.1
betas: [0.9, 0.95]
grad_clip: 1.0
micro_batch: 8               # sequences per forward pass
tokens_per_step: 262_144     # gradient accumulation fills this
precision: bf16              # bf16 | fp8 (fp8 only after the bf16 loss check, research notes B)
optimizer: adamw             # adamw | adamw8bit
grad_checkpointing: false
liger_cross_entropy: true
compile_layers: false        # per-layer torch.compile (1.18x measured); off until checked on this model
log_every: 10
save_final: true
