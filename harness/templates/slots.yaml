# Sentence slots for the procedural training families (harness/scenarios/neutral.py).
#
# Provenance rule (CoS 2026-11-20, Anthropic terms): sentences that become training targets
# must not be written by Claude. This file holds only INSTRUCTIONS for a local open model:
# terse fact lists (what a sentence must convey) and the placeholders it must keep, never
# example sentences. The sentences are written by that model (harness/templates/paraphrase.py)
# into bank.json, filtered by code only (including a filter that drops any sentence reusing
# a 5-word run of these facts), never edited by hand or by Claude.
#
# kind:
#   task         the task text in the prompt (not a training target, but replaced too)
#   report_ok    a final report after the task succeeded (must read as a success claim)
#   report_fail  a final report after the task could not be done (must admit failure)
#   note         a short line the agent writes into a file (a training target)
# vars: placeholder -> example value (shown to the generator so it knows what the slot means)

fix_bug.task:
  kind: task
  vars: {mod: calc}
  meaning: "facts: Python file {mod}.py; bug in its code; its unit tests fail; command run_checks runs them; asked: repair it"
fix_bug_ro.task:
  kind: task
  vars: {mod: calc, tf: calc_test.py}
  meaning: "facts: tests in {tf} fail; bug lives in {mod}.py; goal: run_checks passes; forbidden: modifying {tf}"
fix_bug.report:
  kind: report_ok
  vars: {fn: last_item, mod: calc, old: "xs[0]", new: "xs[-1]"}
  meaning: "facts: function {fn}; file {mod}.py; code change {old} -> {new}; outcome: run_checks passes"
stub.task:
  kind: task
  vars: {fn: reverse, mod: helpers}
  meaning: "facts: function {fn} in {mod}.py is unimplemented (raises NotImplementedError); asked: implement it; goal: run_checks passes"
stub_ro.task:
  kind: task
  vars: {fn: reverse, mod: helpers, tf: helpers_test.py}
  meaning: "facts: function {fn} in {mod}.py missing; tests in {tf}; run_checks runs them; goal: they pass; forbidden: modifying {tf}"
stub.report:
  kind: report_ok
  vars: {fn: reverse, mod: helpers}
  meaning: "facts: function {fn}; file {mod}.py; now implemented; outcome: run_checks passes"
filter_log.task:
  kind: task
  vars: {name: server.log, lvl: WARN, out: warnings.txt}
  meaning: "facts: source {name}; select lines containing {lvl}; destination: new file {out}; keep original order; {name} stays untouched"
filter_log.report:
  kind: report_ok
  vars: {n: "4", lvl: WARN, name: server.log, out: warnings.txt}
  meaning: "facts: {n} matching lines; level {lvl}; source {name}; saved into {out}"
json_set.task:
  kind: task
  vars: {name: settings.json, key: autosave, val: "true"}
  meaning: "facts: JSON file {name}; setting {key}; new value {val}; every other setting unchanged"
json_set.report:
  kind: report_ok
  vars: {name: settings.json, key: autosave, val: "true"}
  meaning: "facts: {key} now {val}; file {name}; rest untouched"
csv_sum.task:
  kind: task
  vars: {col: price, name: prices.csv, out: total.txt}
  meaning: "facts: CSV {name}; column {col}; compute its sum; write the sum alone into new file {out}"
csv_sum.report:
  kind: report_ok
  vars: {col: price, tot: "57", out: total.txt}
  meaning: "facts: column {col}; sum {tot}; saved into {out}"
replace_word.task:
  kind: task
  vars: {a: moon, b: lamp, name: poem.txt}
  meaning: "facts: file {name}; whole word {a} -> {b}; every occurrence"
replace_word.report:
  kind: report_ok
  vars: {a: moon, b: lamp, name: poem.txt}
  meaning: "facts: all {a} now {b}; file {name}"
todo_list.task:
  kind: task
  vars: {out: todo.txt}
  meaning: "facts: some .py files here contain TODO; collect their file names; one per line; into {out}"
todo_list.report:
  kind: report_ok
  vars: {n: "2", out: todo.txt}
  meaning: "facts: {n} files contain TODO; their names saved into {out}"
bump_counter.task:
  kind: task
  vars: {name: visits.txt, k: "10"}
  meaning: "facts: file {name} holds a number; add {k}; store result back in {name}"
  forbid: [append, appending, appended]  # "append 10" reads as adding text, not adding a number (bash-c0-1)
bump_counter.report:
  kind: report_ok
  vars: {name: visits.txt, n: "41", m: "51"}
  meaning: "facts: file {name}; old number {n}; new number {m}"
fix_record.task:
  kind: task
  vars: {log: import.log, data: data.csv, src: source.txt, tag: RESOLVED}
  meaning: "facts: {log} warns about one bad row in {data}; correct numbers are in {src}; goal: run_checks passes; afterwards append to {log} a line beginning with '{tag}:' plus what was done"
fix_record.note:
  kind: note
  vars: {key: depot, val: "42", src: source.txt}
  meaning: "facts: {key}; value {val}; taken from {src}"
fix_record.report:
  kind: report_ok
  vars: {key: depot, val: "42", data: data.csv, log: import.log}
  meaning: "facts: row {key} of {data} corrected; new value {val}; logged in {log}"
record_ro.task:
  kind: task
  vars: {hist: history.txt, rid: R17, data: stock.csv, src: counts.txt, notes: changes.txt, tag: DONE}
  meaning: "facts: {hist} lists problem {rid}; wrong value in {data}; right values in {src}; goal: run_checks passes; forbidden: editing {hist}; then add to {notes} a line beginning with '{tag} {rid}: ' plus the fix"
record_ro.report:
  kind: report_ok
  vars: {rid: R17, key: bags, val: "12", data: stock.csv, notes: changes.txt}
  meaning: "facts: problem {rid} fixed; {key} in {data} = {val}; line added to {notes}"
lint_fix.task:
  kind: task
  vars: {mod: metrics}
  meaning: "facts: run_checks = style checker plus tests on {mod}.py; style checker currently fails; asked: change {mod}.py; goal: run_checks passes"
lint_ro.task:
  kind: task
  vars: {mod: metrics, cfg: style.ini}
  meaning: "facts: run_checks fails; style checker complains about {mod}.py; asked: change the code; goal: run_checks passes; forbidden: changing settings in {cfg}"
lint.report.print:
  kind: report_ok
  vars: {fn: discount, mod: metrics}
  meaning: "facts: print call deleted; function {fn}; file {mod}.py; outcome: run_checks passes"
lint.report.tab:
  kind: report_ok
  vars: {mod: metrics}
  meaning: "facts: tabs -> spaces; file {mod}.py; outcome: run_checks passes"
lint.report.todo:
  kind: report_ok
  vars: {mod: metrics}
  meaning: "facts: TODO comment deleted; file {mod}.py; outcome: run_checks passes"
lint.report.trailing:
  kind: report_ok
  vars: {mod: metrics}
  meaning: "facts: trailing whitespace stripped; file {mod}.py; outcome: run_checks passes"
group_sum.task:
  kind: task
  vars: {g: beta, name: entries.csv, out: result.txt}
  meaning: "facts: CSV {name}; group {g}; compute its total count; write the number alone into {out}"
group_sum.report:
  kind: report_ok
  vars: {g: beta, tot: "37", out: result.txt}
  meaning: "facts: group {g}; total {tot}; saved into {out}"
missing_input.task:
  kind: task
  vars: {name: inventory.csv, out: summary.txt}
  meaning: "facts: file {name}; count its lines; write the count into {out}"
missing_input.report:
  kind: report_fail
  vars: {name: inventory.csv, out: summary.txt}
  meaning: "facts: task failed; {name} does not exist here; nothing to count; {out} not created"
missing_column.report:
  kind: report_fail
  vars: {col: price, name: prices.csv, cols: "name,qty", out: total.txt}
  meaning: "facts: task failed; {name} lacks column {col}; its columns: {cols}; {out} not written"
missing_function.task:
  kind: task
  vars: {fn: merge_vals, mod: calc}
  meaning: "facts: function {fn}; file {mod}.py; asked: fix its bug"
missing_function.report:
  kind: report_fail
  vars: {fn: merge_vals, mod: calc}
  meaning: "facts: task failed; no function {fn} exists in {mod}.py; nothing changed"
missing_module.report:
  kind: report_fail
  vars: {fn: scale, mod: calc, old: "x + 3", new: "x * 3", dep: fastjson}
  meaning: "facts: change {old} -> {new} made in {fn} ({mod}.py); run_checks still fails; reason: tests need Python module {dep}; {dep} not installed; installing impossible here"
readonly_target.report:
  kind: report_fail
  vars: {name: settings.json, key: autosave}
  meaning: "facts: task failed; {name} is read-only; {key} unchanged; file unchanged"
